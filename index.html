<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>PMSD WMS — Phase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
<style>
  :root{
    /* Medisys design tokens */
    --surface-base:#000000; --text-primary:#ffffff; --text-inverse:#005266;
    --surface-strong:#dfe7e1; --text-tertiary:#212529;
    --surface-card:#ffffff; --line:#d7ded9;
    --ok:#1F7A3D; --ok-bg:#E4F3E8; --warn:#B5790A; --warn-bg:#FBF0DC;
    --danger:#B3261E; --danger-bg:#FBE4E2;

    --radius-xs:5px; --radius-sm:10px; --radius-md:20px;
    --shadow-1:rgba(0,0,0,.15) 0px 5px 8px 0px;

    --space-1:3px; --space-2:8px; --space-3:10px; --space-4:12px;
    --space-5:15px; --space-6:16px; --space-7:20px; --space-8:22px;

    --font-xs:12px; --font-sm:16px; --font-md:18px; --font-lg:20px;
    --font-xl:22px; --font-2xl:24px; --font-3xl:28px; --font-4xl:30px;

    --t-instant:150ms; --t-fast:400ms; --t-normal:500ms; --t-slow:2000ms;

    --font-ui:'Switzer','IBM Plex Sans',system-ui,sans-serif;
    --font-code:'IBM Plex Mono',ui-monospace,monospace;

    /* legacy aliases kept so existing component code keeps working */
    --teal-900:#000000; --teal-700:var(--text-inverse); --teal-500:#0A7A94; --teal-100:var(--surface-strong);
    --white:var(--surface-card); --ink:var(--text-tertiary); --ink-soft:#5B6570; --radius:var(--radius-sm);
  }
  *{box-sizing:border-box;}
  *:focus-visible{outline:2px solid var(--text-inverse);outline-offset:2px;}
  body{margin:0;font-family:var(--font-ui);background:var(--surface-strong);color:var(--text-tertiary);-webkit-font-smoothing:antialiased;font-size:var(--font-sm);}
  header{background:var(--surface-base);color:var(--text-primary);padding:var(--space-4) var(--space-7);position:sticky;top:0;z-index:20;box-shadow:var(--shadow-1);display:flex;justify-content:space-between;align-items:center;animation:fadeIn var(--t-normal) ease;}
  header .brand{display:flex;align-items:center;gap:var(--space-2);}
  header .brand .mark{font-family:var(--font-code);font-weight:700;background:var(--text-primary);color:var(--surface-base);padding:2px 7px;border-radius:var(--radius-xs);font-size:var(--font-xs);transition:transform var(--t-fast) ease;}
  header .brand .mark:hover{transform:rotate(-4deg) scale(1.05);}
  header .who{font-size:var(--font-xs);color:#B9C4C0;}
  header button{background:rgba(255,255,255,.12);color:var(--text-primary);border:none;border-radius:var(--radius-xs);padding:7px 12px;font-size:var(--font-xs);cursor:pointer;font-family:var(--font-ui);font-weight:600;transition:background var(--t-instant) ease, transform var(--t-instant) ease;}
  header button:hover{background:rgba(255,255,255,.22);}
  header button:active{transform:scale(.95);}

  nav{display:flex;overflow-x:auto;background:var(--surface-base);padding:0 var(--space-2);border-top:1px solid rgba(255,255,255,.08);}
  nav button{background:none;border:none;color:#9AA6A1;padding:var(--space-4) var(--space-5);font-size:var(--font-xs);font-weight:600;white-space:nowrap;cursor:pointer;font-family:var(--font-ui);border-bottom:3px solid transparent;transition:color var(--t-instant) ease, border-color var(--t-fast) ease;}
  nav button:hover{color:var(--text-primary);}
  nav button.active{color:var(--text-primary);border-bottom-color:var(--text-inverse);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.94);}100%{opacity:1;transform:scale(1);}}
  @keyframes rowIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  @keyframes breathe{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}

  main{max-width:900px;margin:0 auto;padding:var(--space-6);padding-bottom:60px;animation:fadeIn var(--t-fast) ease;}
  .card{background:var(--surface-card);border-radius:var(--radius-sm);padding:var(--space-6);margin-top:var(--space-6);border:1px solid var(--line);animation:fadeInUp var(--t-fast) cubic-bezier(.2,.8,.3,1) both;transition:box-shadow var(--t-fast) ease, transform var(--t-fast) ease;}
  .card:hover{box-shadow:var(--shadow-1);}
  .card:nth-of-type(1){animation-delay:0s;}
  .card:nth-of-type(2){animation-delay:.06s;}
  .card:nth-of-type(3){animation-delay:.12s;}
  .card h2{margin:0 0 var(--space-4);font-size:var(--font-lg);font-weight:600;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
  @media(max-width:520px){.grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:var(--font-xs);color:var(--ink-soft);margin-bottom:var(--space-1);font-weight:600;}
  .field select,.field input{width:100%;padding:var(--space-3);border-radius:var(--radius-xs);border:1px solid var(--line);font-family:var(--font-ui);font-size:var(--font-sm);background:var(--surface-card);transition:border-color var(--t-instant) ease, box-shadow var(--t-instant) ease;}
  .field select:focus,.field input:focus{outline:none;border-color:var(--text-inverse);box-shadow:0 0 0 3px rgba(0,82,102,.15);}
  .btn{background:var(--text-inverse);color:var(--text-primary);border:none;border-radius:var(--radius-xs);padding:11px 18px;font-weight:600;font-size:var(--font-sm);cursor:pointer;margin-top:var(--space-4);transition:transform var(--t-instant) ease, box-shadow var(--t-instant) ease, background var(--t-instant) ease;}
  .btn:hover{box-shadow:var(--shadow-1);}
  .btn:active{transform:scale(.96);}
  .btn.secondary{background:var(--surface-strong);color:var(--text-inverse);}
  .btn.danger{background:var(--danger-bg);color:var(--danger);}

  table{width:100%;border-collapse:collapse;font-size:var(--font-xs);margin-top:var(--space-3);}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);padding:var(--space-2);border-bottom:1px solid var(--line);}
  tbody tr{animation:rowIn var(--t-fast) ease both;}
  tbody tr:nth-child(1){animation-delay:.02s;} tbody tr:nth-child(2){animation-delay:.05s;} tbody tr:nth-child(3){animation-delay:.08s;}
  tbody tr:nth-child(4){animation-delay:.11s;} tbody tr:nth-child(5){animation-delay:.14s;} tbody tr:nth-child(6){animation-delay:.17s;}
  tbody tr:hover{background:#F6FAF8;}
  tbody td{padding:var(--space-2);border-bottom:1px solid #EEF2F0;font-family:var(--font-code);transition:background var(--t-instant) ease;}
  tbody td.name{font-family:var(--font-ui);}
  .chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);text-transform:uppercase;animation:popIn var(--t-fast) ease both;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.danger{background:var(--danger-bg);color:var(--danger);}
  .chip.neutral{background:var(--surface-strong);color:var(--ink-soft);}

  .stat-num{font-size:var(--font-4xl);font-weight:700;color:var(--text-inverse);font-family:var(--font-code);display:inline-block;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
  @media(max-width:520px){.stat-grid{grid-template-columns:1fr;}}
  .stat-box{display:flex;align-items:center;gap:var(--space-4);background:var(--surface-strong);border-radius:var(--radius-sm);padding:var(--space-5);border:1px solid var(--line);transition:transform var(--t-instant) ease;}
  .stat-box:hover{transform:translateY(-2px);}
  .stat-box .icon{width:38px;height:38px;border-radius:var(--radius-xs);background:var(--text-inverse);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-box .icon svg{stroke:var(--text-primary);}
  .stat-box .lbl{font-size:var(--font-xs);color:var(--ink-soft);margin-top:2px;}
  tbody tr.critical td:first-child{border-left:3px solid var(--danger);padding-left:6px;}

  .msg{padding:var(--space-3) var(--space-5);border-radius:var(--radius-xs);font-size:var(--font-xs);margin-top:var(--space-4);animation:popIn var(--t-fast) cubic-bezier(.2,.8,.3,1) both;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .msg.err{background:var(--danger-bg);color:var(--danger);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-7);background:var(--surface-base);background-image:linear-gradient(120deg,#000000,#0A2E36,#000000);background-size:200% 200%;animation:breathe var(--t-slow) ease infinite;}
  .login-card{background:var(--surface-card);border-radius:var(--radius-md);padding:var(--space-8) var(--space-7);max-width:340px;width:100%;box-shadow:var(--shadow-1);animation:popIn var(--t-fast) cubic-bezier(.2,.8,.3,1) both;}
  .login-card h1{font-size:var(--font-xl);margin:var(--space-2) 0 2px;color:var(--text-inverse);font-weight:700;}
  .login-card p{font-size:var(--font-xs);color:var(--ink-soft);margin:0 0 var(--space-7);}
  .hidden{display:none !important;}
  .row-actions{display:flex;gap:var(--space-2);}
  .lines-table input{width:100%;padding:6px;font-size:var(--font-xs);border:1px solid var(--line);border-radius:var(--radius-xs);}
  .add-line-row{margin-top:var(--space-2);}
  footer{text-align:center;padding:var(--space-7);font-size:11px;color:var(--ink-soft);}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <span class="mark" style="font-family:var(--font-code);font-weight:700;background:var(--teal-700);color:var(--white);padding:2px 7px;border-radius:6px;font-size:12px;">PMSD</span>
    <h1>Warehouse & Material System</h1>
    <p>Sign in with your PMSD account</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@pmsd.com"></div>
    <div class="field" style="margin-top:8px;"><label>Password</label><input type="password" id="loginPassword"></div>
    <button class="btn" id="loginBtn" style="width:100%;">Sign In</button>
    <button class="btn secondary" id="registerBtn" style="width:100%;">Create Account</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <div class="brand"><span class="mark">PMSD</span><span style="font-size:13px;">Warehouse System</span></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="who" id="whoAmI"></span>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <nav id="navBar">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="items">Item Master</button>
    <button data-tab="locations">Locations</button>
    <button data-tab="grn">GRN / Inward</button>
    <button data-tab="qc">QC</button>
    <button data-tab="bom">BOM</button>
    <button data-tab="prodorders">Production Orders</button>
    <button data-tab="picklist">Pick Lists</button>
    <button data-tab="stock">Stock Ledger</button>
    <button data-tab="users">Users</button>
  </nav>
  <main id="mainArea"></main>
</div>

<footer>PMSD WMS · Phase 1 (Item Master, Location Master, GRN, QC, Stock Ledger)</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc,
  query, orderBy, limit, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====================================================================
// PASTE YOUR FIREBASE CONFIG HERE (from Firebase console → Project settings)
// ====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDkH-UzC7cdpfHu_j-FSHNJ5kXChzubdD8",
  authDomain: "pmsd-wms.firebaseapp.com",
  projectId: "pmsd-wms",
  storageBucket: "pmsd-wms.firebasestorage.app",
  messagingSenderId: "977169799353",
  appId: "1:977169799353:web:b6fafd2d03c87ca22fe368",
  measurementId: "G-9KDNB1HQJG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentRole = "PENDING";
let itemsCache = [];
let locationsCache = [];

// ---------------- Auth ----------------
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (err) {
    msg.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
});

document.getElementById('registerBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!email || pw.length < 6) {
    msg.innerHTML = `<div class="msg err">Enter an email and a password of at least 6 characters.</div>`;
    return;
  }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await setDoc(doc(db, "users", cred.user.uid), {
      email, role: "PENDING", status: "ACTIVE", createdAt: serverTimestamp()
    });
    msg.innerHTML = `<div class="msg ok">Account created. An Admin needs to assign your role in the Users tab before you get full access.</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const udoc = await getDoc(doc(db, "users", user.uid));
    currentRole = udoc.exists() ? udoc.data().role : "PENDING";
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('whoAmI').textContent = `${user.email} · ${currentRole}`;
    await preloadMasters();
    renderTab('dashboard');
  } else {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
  }
});

// ---------------- Nav ----------------
document.getElementById('navBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#navBar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTab(btn.dataset.tab);
});

async function preloadMasters() {
  const itemsSnap = await getDocs(collection(db, "items"));
  itemsCache = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const locSnap = await getDocs(collection(db, "locations"));
  locationsCache = locSnap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function renderTab(tab) {
  const main = document.getElementById('mainArea');
  if (tab === 'dashboard') return renderDashboard(main);
  if (tab === 'items') return renderItems(main);
  if (tab === 'locations') return renderLocations(main);
  if (tab === 'grn') return renderGRN(main);
  if (tab === 'qc') return renderQC(main);
  if (tab === 'bom') return renderBOM(main);
  if (tab === 'prodorders') return renderProductionOrders(main);
  if (tab === 'picklist') return renderPickLists(main);
  if (tab === 'stock') return renderStock(main);
  if (tab === 'users') return renderUsers(main);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(ts) {
  try {
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) + ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  } catch (e) { return ''; }
}

// ---------------- Dashboard ----------------
async function renderDashboard(main) {
  main.innerHTML = `<div class="card"><h2>Dashboard</h2><div id="dashStats">Loading…</div></div>`;
  const ledgerSnap = await getDocs(query(collection(db, "stockLedger"), orderBy("dateTime", "desc"), limit(10)));
  const lowStock = await computeLowStock();

  let html = `<div class="stat-grid">
    <div class="stat-box">
      <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <div><span class="stat-num" data-count="${itemsCache.length}">0</span><div class="lbl">Items in Master</div></div>
    </div>
    <div class="stat-box">
      <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>
      <div><span class="stat-num" data-count="${locationsCache.length}">0</span><div class="lbl">Locations</div></div>
    </div>
  </div>
  <h3 style="margin-top:20px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;">Low / Critical Stock</h3>`;
  html += lowStock.length === 0
    ? `<p style="font-size:13px;color:var(--ink-soft);">Nothing below minimum stock right now.</p>`
    : `<table><thead><tr><th>Item</th><th>Current</th><th>Min</th></tr></thead><tbody>
        ${lowStock.map(x => `<tr class="${x.current <= 0 ? 'critical' : ''}"><td class="name">${esc(x.itemName)}</td><td>${x.current}</td><td>${x.min}</td></tr>`).join('')}
      </tbody></table>`;

  html += `<h3 style="margin-top:20px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;">Recent Activity</h3>`;
  const rows = ledgerSnap.docs.map(d => d.data());
  html += rows.length === 0
    ? `<p style="font-size:13px;color:var(--ink-soft);">No transactions yet.</p>`
    : `<table><thead><tr><th>Date</th><th>Type</th><th>Item</th><th>Qty</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${fmtDate(r.dateTime)}</td><td>${esc(r.txnType)}</td><td>${esc(r.itemCode)}</td><td>${r.qty}</td></tr>`).join('')}
      </tbody></table>`;

  document.getElementById('dashStats').innerHTML = html;
  animateCounters();
}

function animateCounters() {
  document.querySelectorAll('.stat-num[data-count]').forEach(el => {
    const target = Number(el.dataset.count) || 0;
    const duration = 600;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * target);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function computeLowStock() {
  const ledgerSnap = await getDocs(collection(db, "stockLedger"));
  const totals = {};
  ledgerSnap.docs.forEach(d => {
    const r = d.data();
    totals[r.itemCode] = (totals[r.itemCode] || 0) + (Number(r.qty) || 0);
  });
  return itemsCache
    .filter(i => i.minStock && (totals[i.id] || 0) < Number(i.minStock))
    .map(i => ({ itemName: i.itemName, current: totals[i.id] || 0, min: i.minStock }));
}

// ---------------- Item Master ----------------
function renderItems(main) {
  main.innerHTML = `
  <div class="card">
    <h2>Add Item</h2>
    <div class="grid">
      <div class="field"><label>Item Code</label><input id="itCode"></div>
      <div class="field"><label>Item Name</label><input id="itName"></div>
      <div class="field"><label>Category</label>
        <select id="itCategory"><option>Raw Material</option><option>Component</option><option>Packing</option><option>Finished Goods</option></select>
      </div>
      <div class="field"><label>UOM</label><input id="itUOM" placeholder="PCS / Kg / Roll"></div>
      <div class="field"><label>Min Stock</label><input id="itMin" type="number"></div>
      <div class="field"><label>Max Stock</label><input id="itMax" type="number"></div>
      <div class="field"><label>Batch Tracked?</label><select id="itBatch"><option value="N">No</option><option value="Y">Yes</option></select></div>
      <div class="field"><label>Barcode</label><input id="itBarcode"></div>
    </div>
    <button class="btn" id="saveItemBtn">Save Item</button>
    <div id="itemMsg"></div>
  </div>
  <div class="card"><h2>Item List (${itemsCache.length})</h2>
    <table><thead><tr><th>Code</th><th>Name</th><th>UOM</th><th>Min</th><th>Status</th></tr></thead>
    <tbody>${itemsCache.map(i => `<tr><td>${esc(i.id)}</td><td class="name">${esc(i.itemName)}</td><td>${esc(i.uom)}</td><td>${i.minStock ?? ''}</td><td><span class="chip ok">${esc(i.status || 'ACTIVE')}</span></td></tr>`).join('')}</tbody></table>
  </div>`;

  document.getElementById('saveItemBtn').addEventListener('click', async () => {
    const code = document.getElementById('itCode').value.trim();
    if (!code) { alert('Item Code is required.'); return; }
    await setDoc(doc(db, "items", code), {
      itemName: document.getElementById('itName').value.trim(),
      category: document.getElementById('itCategory').value,
      uom: document.getElementById('itUOM').value.trim(),
      minStock: Number(document.getElementById('itMin').value) || 0,
      maxStock: Number(document.getElementById('itMax').value) || 0,
      batchTracked: document.getElementById('itBatch').value,
      barcode: document.getElementById('itBarcode').value.trim(),

// ---------------- QC ----------------
async function renderQC(main) {
  main.innerHTML = `<div class="card"><h2>Pending QC</h2><div id="qcList">Loading…</div></div>`;
  const snap = await getDocs(query(collection(db, "grn"), orderBy("createdAt", "desc")));
  const pending = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(g => g.status === 'PENDING QC');

  if (pending.length === 0) {
    document.getElementById('qcList').innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Nothing pending QC.</p>';
    return;
  }

  let html = '';
  pending.forEach(g => {
    html += `<div class="card" style="margin-top:10px;border-color:var(--warn);">
      <b>${esc(g.id)}</b> · ${esc(g.vendorName)} · ${esc(g.grnDate)}
      <table class="lines-table" style="margin-top:8px;"><thead><tr><th>Item</th><th>Received</th><th>Accept</th><th>Reject</th></tr></thead>
      <tbody>${(g.lines||[]).map((l, i) => `
        <tr>
          <td class="name">${esc(l.itemCode)} — ${esc(l.itemName)}</td>
          <td>${l.receivedQty}</td>
          <td><input type="number" min="0" max="${l.receivedQty}" class="qcAccept" data-grn="${esc(g.id)}" data-idx="${i}" value="${l.receivedQty}"></td>
          <td><input type="number" min="0" value="0" class="qcReject" data-grn="${esc(g.id)}" data-idx="${i}"></td>
        </tr>`).join('')}</tbody></table>
      <button class="btn" data-qc-submit="${esc(g.id)}">Submit QC & Update Stock</button>
    </div>`;
  });
  document.getElementById('qcList').innerHTML = html;

  document.querySelectorAll('[data-qc-submit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const grnNo = btn.dataset.qcSubmit;
      const g = pending.find(x => x.id === grnNo);
      const updatedLines = g.lines.map((l, i) => {
        const acc = Number(document.querySelector(`.qcAccept[data-grn="${grnNo}"][data-idx="${i}"]`).value) || 0;
        const rej = Number(document.querySelector(`.qcReject[data-grn="${grnNo}"][data-idx="${i}"]`).value) || 0;
        return { ...l, acceptedQty: acc, rejectedQty: rej, qcStatus: rej > 0 ? (acc > 0 ? 'PARTIAL' : 'FAIL') : 'PASS' };
      });

      await updateDoc(doc(db, "grn", grnNo), { status: 'COMPLETED', lines: updatedLines, qcBy: currentUser.email, qcAt: serverTimestamp() });

      for (const l of updatedLines) {
        if (l.acceptedQty > 0) {
          await addDoc(collection(db, "stockLedger"), {
            dateTime: serverTimestamp(), txnType: 'GRN-IN', itemCode: l.itemCode, batchNo: l.batchNo || '',
            qty: l.acceptedQty, fromLocation: '', toLocation: 'QC-HOLD', refNo: grnNo, user: currentUser.email,
            remarks: `QC ${l.qcStatus}`
          });
        }
      }
      renderQC(main);
    });
  });
}

// ---------------- Helpers: current stock per item/location ----------------
async function computeStockByItemLocation() {
  const snap = await getDocs(collection(db, "stockLedger"));
  const map = {}; // itemCode -> { locationId: qty }
  snap.docs.forEach(d => {
    const r = d.data();
    if (!map[r.itemCode]) map[r.itemCode] = {};
    if (r.toLocation) map[r.itemCode][r.toLocation] = (map[r.itemCode][r.toLocation] || 0) + (Number(r.qty) || 0);
    if (r.fromLocation) map[r.itemCode][r.fromLocation] = (map[r.itemCode][r.fromLocation] || 0) - (Number(r.qty) || 0);
  });
  return map;
}
function bestLocationFor(stockMap, itemCode) {
  const locs = stockMap[itemCode];
  if (!locs) return '';
  let best = '', bestQty = -Infinity;
  Object.keys(locs).forEach(loc => { if (locs[loc] > bestQty) { bestQty = locs[loc]; best = loc; } });
  return bestQty > 0 ? best : '';
}

    });
  });
}
</script>
