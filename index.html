<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PMSD Picking List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #10151b;
    --panel: #171f27;
    --panel-2: #1d2732;
    --line: #2a3542;
    --ink: #eef2f6;
    --ink-dim: #9aabbb;
    --amber: #f5a623;
    --amber-dim: #7a5716;
    --green: #33c07a;
    --green-dim: #12331f;
    --red: #ef5b5b;
    --red-dim: #3a1d1d;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }
  ::selection{ background: var(--amber); color:#1a1300; }

  /* ---- Header ---- */
  header{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, #10151b 80%, rgba(16,21,27,0));
    padding: 18px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{
    width:34px; height:34px; border-radius:8px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 4px, #1a1300 4px 8px);
    flex-shrink:0;
    position:relative;
    border: 1px solid #3a2a0a;
  }
  .brand .mark::after{
    content:""; position:absolute; inset:6px;
    background: var(--bg); border-radius:3px;
  }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 17px; margin:0; letter-spacing: 0.2px;
  }
  .brand .sub{
    font-size:11px; color: var(--ink-dim); font-family:'IBM Plex Mono', monospace;
    margin-top:1px;
  }

  /* ---- Tabs (also carry live stat counts — one unified, clickable bar) ---- */
  nav.tabs{
    position: sticky; top: 0; z-index: 19;
    display:flex; gap:6px; padding: 10px 16px; background:var(--bg);
    border-bottom: 1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    background:transparent; color:var(--ink-dim); border:1px solid var(--line);
    padding:8px 13px; border-radius: 999px; cursor:pointer; white-space:nowrap;
    transition: all .15s ease;
  }
  nav.tabs button.active{
    background: var(--amber); color:#1a1300; border-color:var(--amber);
  }
  nav.tabs button.tabstat{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:7px 14px; border-radius:12px; min-width:64px; flex-shrink:0;
  }
  nav.tabs button.tabstat .tn{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px; line-height:1;
  }
  nav.tabs button.tabstat .tl{
    font-family:'Space Grotesk', sans-serif; font-size:10px; font-weight:600; line-height:1;
  }
  nav.tabs button.tabstat .tn.amber-n{ color: var(--amber); }
  nav.tabs button.tabstat.active .tn.amber-n{ color:#1a1300; }

  main{ padding: 16px; max-width: 640px; margin: 0 auto; }
  section.view{ display:none; animation: fade .18s ease; }
  section.view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  h2.section-title{
    font-family:'Space Grotesk', sans-serif; font-size:15px; margin: 4px 0 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  h2.section-title .count{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-dim); font-weight:400;
  }

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  label{ font-size:11px; color: var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  textarea, input[type=text], input[type=number], input[type=password], select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:10px 11px; font-size:14px; font-family:'IBM Plex Mono', monospace;
    outline:none;
  }
  #adminConfirmPinRow{ margin-top:14px; }
  textarea:focus, input:focus, select:focus{ border-color: var(--amber); }
  textarea{ min-height:120px; resize:vertical; }
  select{ font-family:'Inter',sans-serif; }

  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px;
    border-radius:8px; border:1px solid var(--line); padding:11px 16px; cursor:pointer;
    background: var(--panel-2); color: var(--ink); width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .08s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.primary{ background: var(--amber); color:#1a1300; border-color: var(--amber); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color: var(--red); border-color: var(--red-dim); }
  .btn.torch-on{ background: var(--amber); color:#1a1300; border-color: var(--amber); }
  .btn.sm{ padding:8px 12px; font-size:12.5px; width:auto; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  /* ---- Pick list table -> card rows ---- */
  .plist{ display:flex; flex-direction:column; gap:8px; }
  .prow{
    background: var(--panel); border:1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: var(--radius); padding:11px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .prow.done{ border-left-color: var(--green); background: linear-gradient(90deg, var(--green-dim), var(--panel) 30%); }
  .prow.partial{ border-left-color: var(--amber); }
  .prow .info{ flex:1; min-width:0; }
  .prow .code{ font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600; }
  .prow .name{ font-size:12px; color: var(--ink-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .qty{ font-family:'IBM Plex Mono', monospace; text-align:right; flex-shrink:0; }
  .prow .qty .frac{ font-size:15px; font-weight:600; }
  .prow .qty .frac .done-n{ color: var(--green); }
  .prow .qty .frac .partial-n{ color: var(--amber); }
  .prow .tag{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); }
  .badge-done{
    font-size:10px; background: var(--green-dim); color: var(--green); padding:3px 7px; border-radius:5px;
    font-family:'IBM Plex Mono', monospace; flex-shrink:0;
  }

  /* ---- Scan screen: name+qty preview carousel (swipe, stays compact) ---- */
  .spick-carousel{
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:4px; -webkit-overflow-scrolling:touch;
  }
  .spick-carousel::-webkit-scrollbar{ height:4px; }
  .spick-carousel::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
  .spick-row{
    flex:0 0 auto; width: 72%; max-width:300px; scroll-snap-align:start;
    background: var(--panel-2); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius: var(--radius); padding:11px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .spick-row.next-target{
    border-left-color: var(--amber);
    background: linear-gradient(90deg, var(--amber-dim), var(--panel-2) 55%);
  }
  .spick-row .info{ flex:1; min-width:0; }
  .spick-row .sname{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .spick-row .scode{ font-size:10.5px; color: var(--ink-dim); font-family:'IBM Plex Mono', monospace; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spick-row .sqty{ font-family:'IBM Plex Mono', monospace; text-align:right; flex-shrink:0; }
  .spick-row .sqty .n{ font-size:16px; font-weight:600; }
  .spick-row.next-target .sqty .n{ color: var(--amber); }
  .spick-row .sqty .l{ font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }
  .next-pill{
    display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;
    background: var(--amber); color:#1a1300; padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:1px;
  }
  .swipe-hint{ font-size:10px; color:var(--ink-dim); text-align:right; margin-top:4px; }

  /* ---- Last pick / undo bar ---- */
  .last-pick-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--panel-2); border:1px solid var(--amber-dim); border-radius:8px;
    padding: 9px 10px 9px 12px; margin-bottom:12px;
  }
  .last-pick-bar .info{ min-width:0; }
  .last-pick-bar .l{ font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; }
  .last-pick-bar .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .last-pick-bar button{ flex-shrink:0; }

  .empty{
    text-align:center; padding: 40px 20px; color: var(--ink-dim);
  }
  .empty .glyph{ font-size:28px; margin-bottom:8px; opacity:.5; }
  .empty p{ font-size:13px; margin: 4px 0; }

  /* ---- Scanner ---- */
  #reader{ width:100%; border-radius: var(--radius); overflow:hidden; border:1px solid var(--line); }
  #reader video{ border-radius: var(--radius); }
  .scan-frame{
    position:relative;
  }

  .active-bin-chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background: var(--panel-2); border:1px solid var(--amber-dim); border-radius:8px;
    padding: 9px 12px; margin-bottom:12px;
  }
  .active-bin-chip .l{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; }
  .active-bin-chip .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--amber); font-size:14px; }

  /* ---- Confirm sheet ---- */
  .sheet-backdrop{
    position:fixed; inset:0; background: rgba(8,10,13,.72); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background: var(--panel); border-top:1px solid var(--line); border-radius: 16px 16px 0 0;
    padding: 18px 16px 20px; width:100%; max-width:640px;
    animation: up .18s ease;
  }
  @keyframes up{ from{ transform:translateY(30px); opacity:0 } to{ transform:none; opacity:1 } }
  .sheet h3{ font-family:'Space Grotesk',sans-serif; margin:0 0 3px; font-size:16px; }
  .sheet .meta{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; font-family:'IBM Plex Mono', monospace; }
  .qty-stepper{ display:flex; align-items:center; gap:10px; }
  .qty-stepper button{
    width:42px; height:42px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--ink); font-size:19px; cursor:pointer;
  }
  .qty-stepper input{ text-align:center; font-size:18px; font-weight:600; }

  /* ---- toast ---- */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--ink); color:#12161c; padding:11px 18px; border-radius:999px;
    font-size:13px; font-weight:600; font-family:'Space Grotesk',sans-serif;
    opacity:0; transition: all .25s ease; z-index:60; pointer-events:none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.green{ background: var(--green); color:#06210f; }
  #toast.red{ background: var(--red); color:#2a0808; }

  /* ---- bin log ---- */
  .bin-entry{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size:13px;
  }
  .bin-entry:last-child{ border-bottom:none; }
  .bin-entry .code{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .bin-entry .t{ font-size:10.5px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; }

  .foot-actions{
    display:flex; gap:8px; margin-top: 14px;
  }
  .hint{ font-size:11.5px; color:var(--ink-dim); line-height:1.5; margin-top:8px; }

  /* ---- Progress bar ---- */
  .progress-wrap{ margin-bottom:14px; }
  .progress-track{ height:8px; border-radius:999px; background: var(--panel-2); border:1px solid var(--line); overflow:hidden; }
  .progress-fill{ height:100%; background: var(--green); transition: width var(--motion, 300ms) ease; border-radius:999px; }
  .progress-label{ font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; margin-top:5px; text-align:right; }

  /* ---- Filter row (search + status + sort) ---- */
  .filter-row{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .filter-row input[type=text]{ flex:2; min-width:150px; }
  .filter-row select{ flex:1; min-width:110px; }

  /* ---- Location tag on item rows ---- */
  .loc-tag{
    display:inline-block; font-size:10px; font-family:'IBM Plex Mono', monospace;
    color: var(--amber); background: var(--amber-dim); padding:2px 6px; border-radius:5px; margin-top:3px;
  }

  /* ---- Quick-qty preset chips ---- */
  .qty-presets{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .qty-presets button{
    flex:1; min-width:60px; padding:9px 6px; border-radius:8px; border:1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .qty-presets button:active{ background: var(--amber-dim); border-color: var(--amber); }
  .checkline{
    display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim);
    margin-top:9px; cursor:pointer;
  }
  .checkline input{ width:15px; height:15px; accent-color: var(--amber); flex-shrink:0; }
  .divider-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); text-align:center; margin: 12px 0; position:relative; }
  .divider-label::before, .divider-label::after{ content:""; position:absolute; top:50%; width:38%; height:1px; background:var(--line); }
  .divider-label::before{ left:0; } .divider-label::after{ right:0; }

  .sync-badge{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:5px 10px;
    border-radius:999px; white-space:nowrap; flex-shrink:0; align-self:flex-start;
  }
  .sync-badge.live{ background: var(--green-dim); color: var(--green); }
  .sync-badge.connecting{ background: var(--amber-dim); color: var(--amber); }
  .sync-badge.offline{ background: var(--panel-2); color: var(--ink-dim); }

  /* ---- Printable output (bin labels + job summary) ---- */
  #printArea{ display:none; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; background:#fff; color:#000; }
    .print-label{ text-align:center; padding:30px 20px; }
    .print-label-title{ font-size:24px; font-weight:800; margin-bottom:12px; letter-spacing:.04em; }
    .print-label-meta{ font-size:12px; color:#333; margin-top:5px; }
    .print-summary{ padding:20px; }
    .print-summary h1{ font-size:20px; margin:0 0 4px; }
    .print-summary-meta{ font-size:12px; color:#333; margin-bottom:3px; }
    .print-table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:11px; }
    .print-table th, .print-table td{ border:1px solid #999; padding:4px 6px; text-align:left; }
    .print-table thead{ background:#eee; }
    .print-table .status-done{ color:#146c43; font-weight:700; }
    .print-table .status-partial{ color:#a15c00; font-weight:700; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div style="flex:1;">
      <h1>Picking List</h1>
      <div class="sub" id="currentBomHeaderLabel">PMSD &middot; Scan &middot; Match &middot; Bin Track</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
      <div id="syncBadge" class="sync-badge offline">● Local only</div>
      <div id="pickerBadge" class="sync-badge offline" style="cursor:pointer;">👤 Set picker</div>
    </div>
  </div>
  <div class="progress-wrap" style="margin-top:10px;">
    <div class="progress-track"><div class="progress-fill" id="headerProgressFill" style="width:0%;"></div></div>
    <div class="progress-label" id="headerProgressLabel">0 / 0 items (0%)</div>
  </div>
</header>

<nav class="tabs">
  <button class="tabstat active" data-tab="scan">
    <span class="tn">📷</span><span class="tl">Scan &amp; Pick</span>
  </button>
  <button class="tabstat" data-tab="bom">
    <span class="tn" id="tabCountBom">📋</span><span class="tl">BOM</span>
  </button>
  <button class="tabstat" data-tab="list">
    <span class="tn" id="tabCountList">0/0</span><span class="tl">Pick List</span>
  </button>
  <button class="tabstat" data-tab="pending">
    <span class="tn amber-n" id="tabCountPending">0</span><span class="tl">Pending</span>
  </button>
  <button class="tabstat" data-tab="bin">
    <span class="tn" id="tabCountBin">0</span><span class="tl">Bin View</span>
  </button>
  <button class="tabstat" data-tab="setup">
    <span class="tn">⚙</span><span class="tl">Setup</span>
  </button>
</nav>

<main>

  <!-- ===================== SCAN & PICK ===================== -->
  <section class="view active" id="view-scan">
    <div class="active-bin-chip">
      <div>
        <div class="l">Active Bin</div>
        <div class="v" id="activeBinLabel">Not set</div>
      </div>
      <button class="btn sm ghost" id="btnScanActiveBin" style="width:auto;" title="Scan bin QR/barcode">📷</button>
      <button class="btn sm ghost" id="btnChangeBin" style="width:auto;">Set Bin</button>
    </div>
    <div id="readerActiveBin" style="display:none; margin-top:10px;" class="scan-frame"></div>
    <button class="btn sm ghost" id="btnTorchActiveBin" style="display:none; width:auto; margin-top:8px;" title="Toggle flashlight">🔦 Torch</button>

    <div class="last-pick-bar" id="lastPickBar" style="display:none;">
      <div class="info">
        <div class="l">Last picked</div>
        <div class="v" id="lastPickText"></div>
      </div>
      <button class="btn sm ghost" id="btnUndoLastPick">↩ Undo</button>
    </div>

    <div class="card" id="scanPendingCard">
      <label>Pick this <span class="next-pill">next</span> — match by name, then scan to confirm</label>
      <div class="spick-carousel" id="scanPendingList"></div>
      <div class="swipe-hint">swipe ⟵⟶ for more items</div>
    </div>

    <div class="card scan-frame">
      <label>Item scan</label>
      <div id="reader" style="display:none;"></div>
      <div class="row" style="margin-top:8px;">
        <button class="btn primary" id="btnStartItemScan">📷 Scan Item</button>
        <button class="btn ghost" id="btnStopScan" style="display:none;">Stop</button>
        <button class="btn ghost" id="btnTorchItem" style="display:none; width:auto;" title="Toggle flashlight">🔦 Torch</button>
      </div>
      <div class="divider-label">or enter manually</div>
      <input type="text" id="manualItemInput" placeholder="Type / scanner-gun input then Enter">
      <p class="hint">Handheld barcode-gun input works here too — it types into this box and hits Enter automatically.</p>
    </div>
  </section>

  <!-- ===================== PICK LIST ===================== -->
  <section class="view" id="view-list">
    <h2 class="section-title">Master Pick List <span class="count" id="listCount">0 items</span></h2>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="listProgr
