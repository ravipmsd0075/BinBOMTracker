<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#005266">
<title>PMSD WMS — Phase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#00343F; --teal-700:#005266; --teal-500:#0A7A94; --teal-100:#DFE7E1;
    --white:#FFFFFF; --ink:#0D2B30; --ink-soft:#4B6067; --line:#C7D3CE;
    --ok:#1F7A3D; --ok-bg:#E4F3E8; --warn:#B5790A; --warn-bg:#FBF0DC;
    --danger:#B3261E; --danger-bg:#FBE4E2; --radius:10px;
    --font-ui:'IBM Plex Sans',system-ui,sans-serif; --font-code:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-ui);background:var(--teal-100);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{background:var(--teal-700);color:var(--white);padding:14px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;}
  header .brand{display:flex;align-items:center;gap:8px;}
  header .brand .mark{font-family:var(--font-code);font-weight:700;background:var(--white);color:var(--teal-700);padding:2px 7px;border-radius:6px;font-size:12px;}
  header .who{font-size:12px;color:#C9E3EA;}
  header button{background:rgba(255,255,255,.12);color:var(--white);border:none;border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:var(--font-ui);}

  nav{display:flex;overflow-x:auto;background:var(--teal-900);padding:0 8px;}
  nav button{background:none;border:none;color:#AFCBD2;padding:12px 14px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:var(--font-ui);border-bottom:3px solid transparent;}
  nav button.active{color:var(--white);border-bottom-color:#4FD1E8;}

  main{max-width:900px;margin:0 auto;padding:16px;padding-bottom:60px;}
  .card{background:var(--white);border-radius:var(--radius);padding:16px;margin-top:14px;border:1px solid var(--line);}
  .card h2{margin:0 0 12px;font-size:16px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){.grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field select,.field input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-family:var(--font-ui);font-size:14.5px;background:var(--white);}
  .btn{background:var(--teal-700);color:var(--white);border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px;}
  .btn.secondary{background:var(--teal-100);color:var(--teal-700);}
  .btn.danger{background:var(--danger-bg);color:var(--danger);}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line);}
  tbody td{padding:8px;border-bottom:1px solid #EEF2F0;font-family:var(--font-code);}
  tbody td.name{font-family:var(--font-ui);}
  .chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;text-transform:uppercase;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.danger{background:var(--danger-bg);color:var(--danger);}
  .chip.neutral{background:var(--teal-100);color:var(--ink-soft);}

  .msg{padding:10px 13px;border-radius:8px;font-size:13.5px;margin-top:12px;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .msg.err{background:var(--danger-bg);color:var(--danger);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--white);border-radius:14px;padding:28px 24px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.15);}
  .login-card h1{font-size:18px;margin:6px 0 2px;color:var(--teal-700);}
  .login-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .hidden{display:none !important;}
  .row-actions{display:flex;gap:8px;}
  .lines-table input{width:100%;padding:6px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;}
  .add-line-row{margin-top:8px;}
  footer{text-align:center;padding:20px;font-size:11.5px;color:var(--ink-soft);}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <span class="mark" style="font-family:var(--font-code);font-weight:700;background:var(--teal-700);color:var(--white);padding:2px 7px;border-radius:6px;font-size:12px;">PMSD</span>
    <h1>Warehouse & Material System</h1>
    <p>Sign in with your PMSD account</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@pmsd.com"></div>
    <div class="field" style="margin-top:8px;"><label>Password</label><input type="password" id="loginPassword"></div>
    <button class="btn" id="loginBtn" style="width:100%;">Sign In</button>
    <button class="btn secondary" id="registerBtn" style="width:100%;">Create Account</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <div class="brand"><span class="mark">PMSD</span><span style="font-size:13px;">Warehouse System</span></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="who" id="whoAmI"></span>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <nav id="navBar">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="items">Item Master</button>
    <button data-tab="locations">Locations</button>
    <button data-tab="grn">GRN / Inward</button>
    <button data-tab="qc">QC</button>
    <button data-tab="stock">Stock Ledger</button>
    <button data-tab="users">Users</button>
  </nav>
  <main id="mainArea"></main>
</div>

<footer>PMSD WMS · Phase 1 (Item Master, Location Master, GRN, QC, Stock Ledger)</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc,
  query, orderBy, limit, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====================================================================
// PASTE YOUR FIREBASE CONFIG HERE (from Firebase console → Project settings)
// ====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDkH-UzC7cdpfHu_j-FSHNJ5kXChzubdD8",
  authDomain: "pmsd-wms.firebaseapp.com",
  projectId: "pmsd-wms",
  storageBucket: "pmsd-wms.firebasestorage.app",
  messagingSenderId: "977169799353",
  appId: "1:977169799353:web:b6fafd2d03c87ca22fe368",
  measurementId: "G-9KDNB1HQJG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentRole = "PENDING";
let itemsCache = [];
let locationsCache = [];

// ---------------- Auth ----------------
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (err) {
    msg.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
});

document.getElementById('registerBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!email || pw.length < 6) {
    msg.innerHTML = `<div class="msg err">Enter an email and a password of at least 6 characters.</div>`;
    return;
  }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await setDoc(doc(db, "users", cred.user.uid), {
      email, role: "PENDING", status: "ACTIVE", createdAt: serverTimestamp()
    });
    msg.innerHTML = `<div class="msg ok">Account created. An Admin needs to assign your role in the Users tab before you get full access.</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const udoc = await getDoc(doc(db, "users", user.uid));
    currentRole = udoc.exists() ? udoc.data().role : "PENDING";
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('whoAmI').textContent = `${user.email} · ${currentRole}`;
    await preloadMasters();
    renderTab('dashboard');
  } else {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
  }
});

// ---------------- Nav ----------------
document.getElementById('navBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#navBar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTab(btn.dataset.tab);
});

async function preloadMasters() {
  const itemsSnap = await getDocs(collection(db, "items"));
  itemsCache = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const locSnap = await getDocs(collection(db, "locations"));
  locationsCache = locSnap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function renderTab(tab) {
  const main = document.getElementById('mainArea');
  if (tab === 'dashboard') return renderDashboard(main);
  if (tab === 'items') return renderItems(main);
  if (tab === 'locations') return renderLocations(main);
  if (tab === 'grn') return renderGRN(main);
  if (tab === 'qc') return renderQC(main);
  if (tab === 'stock') return renderStock(main);
  if (tab === 'users') return renderUsers(main);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(ts) {
  try {
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) + ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  } catch (e) { return ''; }
}

// ---------------- Dashboard ----------------
async function renderDashboard(main) {
  main.innerHTML = `<div class="card"><h2>Dashboard</h2><div id="dashStats">Loading…</div></div>`;
  const ledgerSnap = await getDocs(query(collection(db, "stockLedger"), orderBy("dateTime", "desc"), limit(10)));
  const lowStock = await computeLowStock();

  let html = `<div class="grid">
    <div><b>${itemsCache.length}</b><br><span style="color:var(--ink-soft);font-size:12.5px;">Items in Master</span></div>
    <div><b>${locationsCache.length}</b><br><span style="color:var(--ink-soft);font-size:12.5px;">Locations</span></div>
  </div>
  <h3 style="margin-top:20px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;">Low / Critical Stock</h3>`;
  html += lowStock.length === 0
    ? `<p style="font-size:13px;color:var(--ink-soft);">Nothing below minimum stock right now.</p>`
    : `<table><thead><tr><th>Item</th><th>Current</th><th>Min</th></tr></thead><tbody>
        ${lowStock.map(x => `<tr><td class="name">${esc(x.itemName)}</td><td>${x.current}</td><td>${x.min}</td></tr>`).join('')}
      </tbody></table>`;

  html += `<h3 style="margin-top:20px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;">Recent Activity</h3>`;
  const rows = ledgerSnap.docs.map(d => d.data());
  html += rows.length === 0
    ? `<p style="font-size:13px;color:var(--ink-soft);">No transactions yet.</p>`
    : `<table><thead><tr><th>Date</th><th>Type</th><th>Item</th><th>Qty</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${fmtDate(r.dateTime)}</td><td>${esc(r.txnType)}</td><td>${esc(r.itemCode)}</td><td>${r.qty}</td></tr>`).join('')}
      </tbody></table>`;

  document.getElementById('dashStats').innerHTML = html;
}

async function computeLowStock() {
  const ledgerSnap = await getDocs(collection(db, "stockLedger"));
  const totals = {};
  ledgerSnap.docs.forEach(d => {
    const r = d.data();
    totals[r.itemCode] = (totals[r.itemCode] || 0) + (Number(r.qty) || 0);
  });
  return itemsCache
    .filter(i => i.minStock && (totals[i.id] || 0) < Number(i.minStock))
    .map(i => ({ itemName: i.itemName, current: totals[i.id] || 0, min: i.minStock }));
}

// ---------------- Item Master ----------------
function renderItems(main) {
  main.innerHTML = `
  <div class="card">
    <h2>Add Item</h2>
    <div class="grid">
      <div class="field"><label>Item Code</label><input id="itCode"></div>
      <div class="field"><label>Item Name</label><input id="itName"></div>
      <div class="field"><label>Category</label>
        <select id="itCategory"><option>Raw Material</option><option>Component</option><option>Packing</option><option>Finished Goods</option></select>
      </div>
      <div class="field"><label>UOM</label><input id="itUOM" placeholder="PCS / Kg / Roll"></div>
      <div class="field"><label>Min Stock</label><input id="itMin" type="number"></div>
      <div class="field"><label>Max Stock</label><input id="itMax" type="number"></div>
      <div class="field"><label>Batch Tracked?</label><select id="itBatch"><option value="N">No</option><option value="Y">Yes</option></select></div>
      <div class="field"><label>Barcode</label><input id="itBarcode"></div>
    </div>
    <button class="btn" id="saveItemBtn">Save Item</button>
    <div id="itemMsg"></div>
  </div>
  <div class="card"><h2>Item List (${itemsCache.length})</h2>
    <table><thead><tr><th>Code</th><th>Name</th><th>UOM</th><th>Min</th><th>Status</th></tr></thead>
    <tbody>${itemsCache.map(i => `<tr><td>${esc(i.id)}</td><td class="name">${esc(i.itemName)}</td><td>${esc(i.uom)}</td><td>${i.minStock ?? ''}</td><td><span class="chip ok">${esc(i.status || 'ACTIVE')}</span></td></tr>`).join('')}</tbody></table>
  </div>`;

  document.getElementById('saveItemBtn').addEventListener('click', async () => {
    const code = document.getElementById('itCode').value.trim();
    if (!code) { alert('Item Code is required.'); return; }
    await setDoc(doc(db, "items", code), {
      itemName: document.getElementById('itName').value.trim(),
      category: document.getElementById('itCategory').value,
      uom: document.getElementById('itUOM').value.trim(),
      minStock: Number(document.getElementById('itMin').value) || 0,
      maxStock: Number(document.getElementById('itMax').value) || 0,
      batchTracked: document.getElementById('itBatch').value,
      barcode: document.getElementById('itBarcode').value.trim(),
      status: "ACTIVE"
    });
    await preloadMasters();
    document.getElementById('itemMsg').innerHTML = `<div class="msg ok">Saved: ${esc(code)}</div>`;
    renderItems(main);
  });
}

// ---------------- Location Master ----------------
function renderLocations(main) {
  main.innerHTML = `
  <div class="card">
    <h2>Add Location</h2>
    <div class="grid">
      <div class="field"><label>Location ID</label><input id="locId" placeholder="RM-A01-R2-P03"></div>
      <div class="field"><label>Zone</label>
        <select id="locZone"><option>RAW MATERIAL</option><option>WIP</option><option>FINISHED GOODS</option><option>QC-HOLD</option></select>
      </div>
      <div class="field"><label>Rack</label><input id="locRack"></div>
      <div class="field"><label>Row</label><input id="locRow"></div>
      <div class="field"><label>Position/Bin</label><input id="locPos"></div>
      <div class="field"><label>Type</label>
        <select id="locType"><option>STORAGE</option><option>QC-HOLD</option><option>TRANSFER-BIN</option><option>LINE-SIDE</option></select>
      </div>
    </div>
    <button class="btn" id="saveLocBtn">Save Location</button>
    <div id="locMsg"></div>
  </div>
  <div class="card"><h2>Locations (${locationsCache.length})</h2>
    <table><thead><tr><th>ID</th><th>Zone</th><th>Type</th><th>Status</th></tr></thead>
    <tbody>${locationsCache.map(l => `<tr><td>${esc(l.id)}</td><td class="name">${esc(l.zone)}</td><td>${esc(l.locationType)}</td><td><span class="chip ok">${esc(l.status || 'ACTIVE')}</span></td></tr>`).join('')}</tbody></table>
  </div>`;

  document.getElementById('saveLocBtn').addEventListener('click', async () => {
    const id = document.getElementById('locId').value.trim();
    if (!id) { alert('Location ID is required.'); return; }
    await setDoc(doc(db, "locations", id), {
      zone: document.getElementById('locZone').value,
      rack: document.getElementById('locRack').value.trim(),
      row: document.getElementById('locRow').value.trim(),
      position: document.getElementById('locPos').value.trim(),
      locationType: document.getElementById('locType').value,
      status: "ACTIVE"
    });
    await preloadMasters();
    document.getElementById('locMsg').innerHTML = `<div class="msg ok">Saved: ${esc(id)}</div>`;
    renderLocations(main);
  });
}

// ---------------- GRN ----------------
let grnLines = [];

function renderGRN(main) {
  grnLines = [];
  main.innerHTML = `
  <div class="card">
    <h2>New GRN (Material Inward)</h2>
    <div class="grid">
      <div class="field"><label>GRN No.</label><input id="grnNo" placeholder="auto if left blank"></div>
      <div class="field"><label>PO Reference</label><input id="grnPO"></div>
      <div class="field"><label>Vendor Name</label><input id="grnVendor"></div>
      <div class="field"><label>GRN Date</label><input id="grnDate" type="date"></div>
    </div>

    <h3 style="margin-top:16px;font-size:13px;">Add Line Item</h3>
    <div class="grid">
      <div class="field"><label>Item</label>
        <select id="grnItemSel"><option value="">-- Select --</option>${itemsCache.map(i => `<option value="${esc(i.id)}">${esc(i.id)} — ${esc(i.itemName)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Qty</label><input id="grnQty" type="number" min="1"></div>
      <div class="field"><label>Batch No (if applicable)</label><input id="grnBatch"></div>
    </div>
    <button class="btn secondary" id="addLineBtn">+ Add Line</button>

    <table class="lines-table"><thead><tr><th>Item</th><th>Qty</th><th>Batch</th><th></th></tr></thead>
    <tbody id="grnLinesBody"></tbody></table>

    <button class="btn" id="saveGrnBtn">Create GRN</button>
    <div id="grnMsg"></div>
  </div>
  <div class="card"><h2>Recent GRNs</h2><div id="grnList">Loading…</div></div>`;

  document.getElementById('grnDate').value = new Date().toISOString().slice(0,10);

  document.getElementById('addLineBtn').addEventListener('click', () => {
    const code = document.getElementById('grnItemSel').value;
    const qty = Number(document.getElementById('grnQty').value);
    const batch = document.getElementById('grnBatch').value.trim();
    if (!code || !qty) { alert('Select an item and enter a quantity.'); return; }
    const item = itemsCache.find(i => i.id === code);
    grnLines.push({ itemCode: code, itemName: item?.itemName || '', receivedQty: qty, batchNo: batch, qcStatus: 'PENDING' });
    document.getElementById('grnQty').value = '';
    document.getElementById('grnBatch').value = '';
    renderGrnLines();
  });

  renderGrnLines();
  loadRecentGRNs();

  document.getElementById('saveGrnBtn').addEventListener('click', async () => {
    if (grnLines.length === 0) { alert('Add at least one line item.'); return; }
    const grnNo = document.getElementById('grnNo').value.trim() || ('GRN-' + Date.now());
    await setDoc(doc(db, "grn", grnNo), {
      poRef: document.getElementById('grnPO').value.trim(),
      vendorName: document.getElementById('grnVendor').value.trim(),
      grnDate: document.getElementById('grnDate').value,
      status: 'PENDING QC',
      createdBy: currentUser.email,
      createdAt: serverTimestamp(),
      lines: grnLines
    });
    document.getElementById('grnMsg').innerHTML = `<div class="msg ok">GRN created: ${esc(grnNo)}. Now goes to QC.</div>`;
    grnLines = [];
    renderGrnLines();
    loadRecentGRNs();
  });
}

function renderGrnLines() {
  document.getElementById('grnLinesBody').innerHTML = grnLines.map((l, idx) => `
    <tr><td class="name">${esc(l.itemCode)} — ${esc(l.itemName)}</td><td>${l.receivedQty}</td><td>${esc(l.batchNo)}</td>
    <td><button class="btn danger" style="padding:4px 8px;margin:0;font-size:11px;" data-idx="${idx}">✕</button></td></tr>
  `).join('') || '<tr><td colspan="4" style="color:var(--ink-soft);">No lines added yet.</td></tr>';
  document.querySelectorAll('#grnLinesBody button[data-idx]').forEach(b => {
    b.addEventListener('click', () => { grnLines.splice(Number(b.dataset.idx), 1); renderGrnLines(); });
  });
}

async function loadRecentGRNs() {
  const snap = await getDocs(query(collection(db, "grn"), orderBy("createdAt", "desc"), limit(10)));
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById('grnList').innerHTML = rows.length === 0
    ? '<p style="font-size:13px;color:var(--ink-soft);">No GRNs yet.</p>'
    : `<table><thead><tr><th>GRN No</th><th>Vendor</th><th>Lines</th><th>Status</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(r.id)}</td><td class="name">${esc(r.vendorName)}</td><td>${(r.lines||[]).length}</td><td><span class="chip ${r.status==='COMPLETED'?'ok':'warn'}">${esc(r.status)}</span></td></tr>`).join('')}
      </tbody></table>`;
}

// ---------------- QC ----------------
async function renderQC(main) {
  main.innerHTML = `<div class="card"><h2>Pending QC</h2><div id="qcList">Loading…</div></div>`;
  const snap = await getDocs(query(collection(db, "grn"), orderBy("createdAt", "desc")));
  const pending = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(g => g.status === 'PENDING QC');

  if (pending.length === 0) {
    document.getElementById('qcList').innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">Nothing pending QC.</p>';
    return;
  }

  let html = '';
  pending.forEach(g => {
    html += `<div class="card" style="margin-top:10px;border-color:var(--warn);">
      <b>${esc(g.id)}</b> · ${esc(g.vendorName)} · ${esc(g.grnDate)}
      <table class="lines-table" style="margin-top:8px;"><thead><tr><th>Item</th><th>Received</th><th>Accept</th><th>Reject</th></tr></thead>
      <tbody>${(g.lines||[]).map((l, i) => `
        <tr>
          <td class="name">${esc(l.itemCode)} — ${esc(l.itemName)}</td>
          <td>${l.receivedQty}</td>
          <td><input type="number" min="0" max="${l.receivedQty}" class="qcAccept" data-grn="${esc(g.id)}" data-idx="${i}" value="${l.receivedQty}"></td>
          <td><input type="number" min="0" value="0" class="qcReject" data-grn="${esc(g.id)}" data-idx="${i}"></td>
        </tr>`).join('')}</tbody></table>
      <button class="btn" data-qc-submit="${esc(g.id)}">Submit QC & Update Stock</button>
    </div>`;
  });
  document.getElementById('qcList').innerHTML = html;

  document.querySelectorAll('[data-qc-submit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const grnNo = btn.dataset.qcSubmit;
      const g = pending.find(x => x.id === grnNo);
      const updatedLines = g.lines.map((l, i) => {
        const acc = Number(document.querySelector(`.qcAccept[data-grn="${grnNo}"][data-idx="${i}"]`).value) || 0;
        const rej = Number(document.querySelector(`.qcReject[data-grn="${grnNo}"][data-idx="${i}"]`).value) || 0;
        return { ...l, acceptedQty: acc, rejectedQty: rej, qcStatus: rej > 0 ? (acc > 0 ? 'PARTIAL' : 'FAIL') : 'PASS' };
      });

      await updateDoc(doc(db, "grn", grnNo), { status: 'COMPLETED', lines: updatedLines, qcBy: currentUser.email, qcAt: serverTimestamp() });

      for (const l of updatedLines) {
        if (l.acceptedQty > 0) {
          await addDoc(collection(db, "stockLedger"), {
            dateTime: serverTimestamp(), txnType: 'GRN-IN', itemCode: l.itemCode, batchNo: l.batchNo || '',
            qty: l.acceptedQty, fromLocation: '', toLocation: 'QC-HOLD', refNo: grnNo, user: currentUser.email,
            remarks: `QC ${l.qcStatus}`
          });
        }
      }
      renderQC(main);
    });
  });
}

// ---------------- Stock Ledger ----------------
async function renderStock(main) {
  main.innerHTML = `<div class="card"><h2>Stock Ledger</h2><div id="stockList">Loading…</div></div>`;
  const snap = await getDocs(query(collection(db, "stockLedger"), orderBy("dateTime", "desc"), limit(100)));
  const rows = snap.docs.map(d => d.data());
  document.getElementById('stockList').innerHTML = rows.length === 0
    ? '<p style="font-size:13px;color:var(--ink-soft);">No transactions yet.</p>'
    : `<table><thead><tr><th>Date</th><th>Type</th><th>Item</th><th>Qty</th><th>From</th><th>To</th><th>Ref</th><th>User</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${fmtDate(r.dateTime)}</td><td><span class="chip neutral">${esc(r.txnType)}</span></td><td>${esc(r.itemCode)}</td><td>${r.qty}</td><td>${esc(r.fromLocation)}</td><td>${esc(r.toLocation)}</td><td>${esc(r.refNo)}</td><td class="name">${esc(r.user)}</td></tr>`).join('')}
      </tbody></table>`;
}

// ---------------- Users (role admin) ----------------
async function renderUsers(main) {
  main.innerHTML = `<div class="card"><h2>Users</h2><div id="usersList">Loading…</div></div>`;
  if (currentRole !== 'ADMIN') {
    document.getElementById('usersList').innerHTML = '<p style="font-size:13px;color:var(--danger);">Only Admins can manage users.</p>';
    return;
  }
  const snap = await getDocs(collection(db, "users"));
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById('usersList').innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Change Role</th></tr></thead><tbody>
    ${rows.map(u => `<tr><td class="name">${esc(u.email)}</td><td><span class="chip ${u.role==='PENDING'?'warn':'ok'}">${esc(u.role)}</span></td><td>${esc(u.status)}</td>
    <td><select data-uid="${u.id}" class="roleSelect">
      ${['PENDING','ADMIN','STORE','QC','PICKER','SUPERVISOR','LINE OPERATOR'].map(r => `<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}
    </select></td></tr>`).join('')}
  </tbody></table>`;

  document.querySelectorAll('.roleSelect').forEach(sel => {
    sel.addEventListener('change', async () => {
      await updateDoc(doc(db, "users", sel.dataset.uid), { role: sel.value });
      alert('Role updated.');
    });
  });
}
