<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PMSD WMS</title>
<style>
  :root{
    --bg:#10151b; --panel:#171f27; --panel-2:#1d2732; --line:#2a3542;
    --ink:#eef2f6; --ink-dim:#9aabbb; --amber:#f5a623; --radius:14px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg); color: var(--ink);
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #landing{
    width:100%; max-width:460px; padding:24px; margin:0 auto;
  }
  .lhead{ text-align:center; margin-bottom:28px; }
  .lmark{
    width:52px; height:52px; border-radius:12px; margin:0 auto 14px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 4px, #1a1300 4px 8px);
    border:1px solid #3a2a0a; position:relative;
  }
  .lmark::after{ content:""; position:absolute; inset:9px; background:var(--bg); border-radius:5px; }
  .lhead h1{ font-size:20px; margin:0 0 4px; letter-spacing:.2px; }
  .lhead p{ font-size:12.5px; color:var(--ink-dim); margin:0; }
  .modules{ display:flex; flex-direction:column; gap:14px; }
  .mod-btn{
    display:flex; align-items:center; gap:14px; text-align:left;
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding:18px; cursor:pointer; color:var(--ink); width:100%;
    transition: transform .1s ease, border-color .15s ease;
  }
  .mod-btn:active{ transform:scale(0.98); }
  .mod-btn:hover{ border-color: var(--amber); }
  .mod-btn .icon{
    font-size:26px; width:50px; height:50px; flex-shrink:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center; background: var(--panel-2);
  }
  .mod-btn .txt strong{ display:block; font-size:15.5px; margin-bottom:2px; }
  .mod-btn .txt span{ font-size:12px; color:var(--ink-dim); line-height:1.4; display:block; }
  .mod-btn .arrow{ margin-left:auto; color:var(--ink-dim); font-size:18px; flex-shrink:0; }

  #frameWrap{ display:none; position:fixed; inset:0; z-index:100; background:var(--bg); }
  #backBtn{
    position:fixed; top:10px; left:10px; z-index:101;
    background: rgba(23,31,39,0.92); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px 8px 12px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px; cursor:pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  #appFrame{ width:100%; height:100%; border:none; display:block; }
  .lfoot{ text-align:center; margin-top:22px; font-size:10.5px; color:var(--ink-dim); }
  #loadErr{ display:none; max-width:460px; margin:18px auto 0; padding:14px; background:#3a1d1d; border:1px solid #5a2a2a; border-radius:10px; font-size:12.5px; }
</style>
</head>
<body>

<div id="landing">
  <div class="lhead">
    <div class="lmark"></div>
    <h1>PMSD WMS</h1>
    <p>Choose a module to continue</p>
  </div>
  <div class="modules">
    <button class="mod-btn" id="btnStore">
      <div class="icon">📥</div>
      <div class="txt">
        <strong>Store</strong>
        <span>Scan &amp; pick items, log into bins, manage BOMs</span>
      </div>
      <div class="arrow">›</div>
    </button>
    <button class="mod-btn" id="btnProd">
      <div class="icon">👁️</div>
      <div class="txt">
        <strong>Production</strong>
        <span>View-only bin lookup — check what's inside a bin</span>
      </div>
      <div class="arrow">›</div>
    </button>
  </div>
  <div class="lfoot">Same live session data across both modules</div>
  <div id="loadErr"></div>
</div>

<div id="frameWrap">
  <button id="backBtn">← Modules</button>
  <iframe id="appFrame" title="module" sandbox="allow-scripts allow-forms allow-same-origin allow-modals allow-popups"></iframe>
</div>

  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const landing = document.getElementById('landing');
  const frameWrap = document.getElementById('frameWrap');
  const appFrame = document.getElementById('appFrame');
  const backBtn = document.getElementById('backBtn');
  const loadErr = document.getElementById('loadErr');

  function openModule(b64){
    try{
      const html = b64ToUtf8(b64);
      appFrame.srcdoc = html;
      landing.style.display = 'none';
      frameWrap.style.display = 'block';
      history.pushState({ open: true }, '');
    }catch(e){
      loadErr.style.display = 'block';
      loadErr.textContent = 'Could not load module: ' + e.message + '. Try opening this file in Chrome instead of a file-manager preview, or open it via the hosted link.';
      console.error(e);
    }
  }
  function closeModule(){
    appFrame.srcdoc = '';
    frameWrap.style.display = 'none';
    landing.style.display = 'block';
  }

  document.getElementById('btnStore').addEventListener('click', ()=> openModule(STORE_B64));
  document.getElementById('btnProd').addEventListener('click', ()=> openModule(PROD_B64));
  backBtn.addEventListener('click', ()=> history.back());
  window.addEventListener('popstate', ()=> closeModule());
</script>
